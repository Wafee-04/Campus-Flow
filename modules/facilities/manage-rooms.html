<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms - Campus Flow</title>
    <link rel="stylesheet" href="../../Assets/css/common.css">
    <link rel="stylesheet" href="../../Assets/css/facilities.css">
</head>

<body>
    <div class="facilities-layout">

        <header class="facilities-navbar">
            <span class="facilities-navbar-brand">Campus Flow</span>
            <span class="facilities-navbar-title">Manage Rooms</span>
            <span class="facilities-navbar-user">Demo User</span>
        </header>

        <aside class="facilities-sidebar">
            <ul>
                <li><a href="#">Overview</a></li>
                <li><a href="buildings.html">Buildings</a></li>
                <li><a href="rooms.html" class="active">Rooms</a></li>
                <li><a href="facilities.html">Facilities</a></li>
                <li><a href="reservations.html">Reservations</a></li>
            </ul>
        </aside>

        <main class="facilities-content">
            <div class="facilities-page-header">
                <h1>Manage Rooms</h1>
                <a class="facilities-button facilities-button-secondary" href="rooms.html">Back to Rooms</a>
            </div>

            <div class="facilities-card">
                <h2 id="roomFormTitle">Add Room</h2>
                <p class="facilities-note">Demo only. Changes are lost when the page is refreshed.</p>
                <div id="roomMessage"></div>

                <form id="roomForm" class="facilities-form" novalidate>
                    <div class="facilities-form-group">
                        <label for="roomId">Room ID</label>
                        <input type="text" id="roomId" placeholder="Created automatically" readonly>
                    </div>

                    <div class="facilities-form-group">
                        <label for="roomNumber">Room Number</label>
                        <input type="text" id="roomNumber">
                    </div>

                    <div class="facilities-form-group">
                        <label for="roomBuilding">Building</label>
                        <select id="roomBuilding">
                            <option value="">Select building</option>
                        </select>
                    </div>

                    <div class="facilities-form-group">
                        <label for="roomFloor">Floor</label>
                        <select id="roomFloor">
                            <option value="">Select floor</option>
                        </select>
                    </div>

                    <div class="facilities-form-group">
                        <label for="roomType">Type</label>
                        <select id="roomType">
                            <option value="">Select type</option>
                        </select>
                    </div>

                    <div class="facilities-form-group">
                        <label for="roomCapacity">Estimated Capacity</label>
                        <input type="number" id="roomCapacity" min="1">
                    </div>

                    <div class="facilities-form-group">
                        <label for="roomStatus">Status</label>
                        <select id="roomStatus"></select>
                    </div>

                    <div class="facilities-form-group full-width">
                        <label for="roomDescription">Description</label>
                        <textarea id="roomDescription"></textarea>
                    </div>

                    <div class="facilities-form-actions">
                        <button type="submit" class="facilities-button">Save Room</button>
                        <button type="button" id="roomCancelButton"
                            class="facilities-button facilities-button-secondary">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="facilities-card">
                <h2>All Rooms</h2>
                <div class="facilities-table-wrapper">
                    <table class="facilities-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Room Number</th>
                                <th>Building</th>
                                <th>Floor</th>
                                <th>Type</th>
                                <th>Estimated Capacity</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="roomManageTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <script src="../../Assets/js/buildings.js"></script>
    <script src="../../Assets/js/rooms.js"></script>
</body>

</html>
