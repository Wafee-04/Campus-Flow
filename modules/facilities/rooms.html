<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms - Campus Flow</title>
    <link rel="stylesheet" href="../../Assets/css/common.css">
    <link rel="stylesheet" href="../../Assets/css/facilities.css">
</head>

<body>
    <div class="facilities-layout">

        <header class="facilities-navbar">
            <span class="facilities-navbar-brand">Campus Flow</span>
            <span class="facilities-navbar-title">Rooms</span>
            <span class="facilities-navbar-user">Demo User</span>
        </header>

        <aside class="facilities-sidebar">
            <ul>
                <li><a href="#">Overview</a></li>
                <li><a href="buildings.html">Buildings</a></li>
                <li><a href="rooms.html" class="active">Rooms</a></li>
                <li><a href="facilities.html">Facilities</a></li>
                <li><a href="reservations.html">Reservations</a></li>
            </ul>
        </aside>

        <main class="facilities-content">
            <div class="facilities-page-header">
                <h1>Rooms</h1>
                <a class="facilities-button" href="manage-rooms.html">Manage Rooms</a>
            </div>

            <div class="facilities-card">
                <p class="facilities-note">Rooms shown are DEMO data, not official AIUB data.</p>

                <div class="facilities-toolbar">
                    <input type="text" id="roomSearch" placeholder="Search by room number or building"
                        aria-label="Search rooms">
                    <select id="roomTypeFilter" aria-label="Filter by type">
                        <option value="">All Types</option>
                    </select>
                    <select id="roomStatusFilter" aria-label="Filter by status">
                        <option value="">All Statuses</option>
                    </select>
                </div>

                <div class="facilities-table-wrapper">
                    <table class="facilities-table">
                        <thead>
                            <tr>
                                <th>Room Number</th>
                                <th>Building</th>
                                <th>Floor</th>
                                <th>Type</th>
                                <th>Estimated Capacity</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="roomsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <script src="../../Assets/js/buildings.js"></script>
    <script src="../../Assets/js/rooms.js"></script>
</body>

</html>
