<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilities - Campus Flow</title>
    <link rel="stylesheet" href="../../Assets/css/common.css">
    <link rel="stylesheet" href="../../Assets/css/facilities.css">
</head>

<body>
    <div class="facilities-layout">

        <header class="facilities-navbar">
            <span class="facilities-navbar-brand">Campus Flow</span>
            <span class="facilities-navbar-title">Facilities</span>
            <span class="facilities-navbar-user">Demo User</span>
        </header>

        <aside class="facilities-sidebar">
            <ul>
                <li><a href="#">Overview</a></li>
                <li><a href="buildings.html">Buildings</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="facilities.html" class="active">Facilities</a></li>
                <li><a href="reservations.html">Reservations</a></li>
            </ul>
        </aside>

        <main class="facilities-content">
            <div class="facilities-page-header">
                <h1>Facilities</h1>
                <a class="facilities-button" href="manage-facilities.html">Manage Facilities</a>
            </div>

            <div class="facilities-card">
                <p class="facilities-note">Facilities shown are DEMO data, not official AIUB data.</p>

                <div class="facilities-toolbar">
                    <input type="text" id="facilitySearch" placeholder="Search by name or building"
                        aria-label="Search facilities">
                </div>

                <div class="facilities-table-wrapper">
                    <table class="facilities-table">
                        <thead>
                            <tr>
                                <th>Facility Name</th>
                                <th>Building</th>
                                <th>Opening Hours</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="facilitiesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <script src="../../Assets/js/buildings.js"></script>
    <script src="../../Assets/js/facilities.js"></script>
</body>

</html>
